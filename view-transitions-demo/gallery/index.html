<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxi.js — View Transitions demo</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{color:#f5f5f5;background:#171717;min-height:100vh;margin:0;padding:2.5rem 1.5rem;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}main{max-width:720px;margin:0 auto}a{color:inherit}.back-link{margin-bottom:1.5rem;font-weight:600;text-decoration:none;display:inline-block}.back-link:hover{text-decoration:underline}h1{margin-top:0}.gallery{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1.5rem;margin:2rem 0 0;padding:0;list-style:none;display:grid}.card{text-align:center;text-decoration:none;display:block}.card .caption{margin-top:.75rem;font-weight:600;display:block}.photo{user-select:none;border-radius:1rem;justify-content:center;align-items:center;font-size:3rem;display:flex}.gallery .photo{aspect-ratio:1;width:100%}.detail .photo{aspect-ratio:1;width:100%;margin:0 auto 1.5rem;font-size:5rem}.photo-1{background:linear-gradient(135deg,#f97316,#facc15)}.photo-2{background:linear-gradient(135deg,#22d3ee,#6366f1)}.photo-3{background:linear-gradient(135deg,#ec4899,#a855f7)}::view-transition-group(photo-1),::view-transition-group(photo-2),::view-transition-group(photo-3){animation-duration:.5s}::view-transition-old(photo-1),::view-transition-new(photo-1),::view-transition-old(photo-2),::view-transition-new(photo-2),::view-transition-old(photo-3),::view-transition-new(photo-3){object-fit:cover}
